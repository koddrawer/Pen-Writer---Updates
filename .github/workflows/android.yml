name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/package.json'
      - 'mobile/android/**'
      - 'mobile/node/main.js'
      - 'mobile/node/package.json'
      - '.github/workflows/android.yml'
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Phiên bản APK
        id: v
        run: |
          echo "name=$(node -p "require('./mobile/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "app=$(node -p "require('./app/version.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cài thư viện Capacitor
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Dựng www (giao diện + lõi Node)
        working-directory: mobile
        env:
          VERSION_NAME: ${{ steps.v.outputs.name }}
        run: node build-www.js ../app
      - name: Capacitor sync
        working-directory: mobile
        run: npx cap sync android
      - name: Build APK
        working-directory: mobile/android
        env:
          VERSION_NAME: ${{ steps.v.outputs.name }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../../out
          cp app/build/outputs/apk/release/*.apk ../../out/PenWriter.apk
          cp ../../out/PenWriter.apk "../../out/PenWriter-${{ steps.v.outputs.name }}.apk"
          ls -la ../../out
      - uses: actions/upload-artifact@v4
        with:
          name: PenWriter-apk
          path: out/PenWriter.apk
      - name: Đăng lên Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.v.outputs.name }}
          name: Pen Writer Android ${{ steps.v.outputs.name }}
          make_latest: true
          body: |
            APK Pen Writer cho Android (bản cài ${{ steps.v.outputs.name }}, kèm giao diện v${{ steps.v.outputs.app }}).
            Giao diện và lõi tự cập nhật từ repo này, chỉ cần cài APK mới khi có bản cài mới.
          files: |
            out/PenWriter.apk
            out/PenWriter-${{ steps.v.outputs.name }}.apk
